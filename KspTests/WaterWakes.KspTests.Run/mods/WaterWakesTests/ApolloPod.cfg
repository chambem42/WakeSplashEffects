// WaterWakes' splash tests: the stock Mk1-3 pod and its 2.5 m heat shield at an Apollo command module's size (3.91 m across:
// x1.564), for Splash_ApolloPodDrops (crafts/Splash Apollo Pod.craft). The pod carries the Ore the test fills to set its
// mass (its own mass and the shield's kept small); both survive the test's hits (stock buoyancy breaks a part hitting
// the water faster than its crash tolerance, cheat or not).
+PART[mk1-3pod]:FINAL
{
	@name = farTestApolloPod
	@title = Apollo-size Mk1-3 Pod (FAR splash tests)
	@rescaleFactor = 1.564
	@mass = 0.5
	@crashTolerance = 1000
	!RESOURCE[MonoPropellant] {}
	RESOURCE
	{
		name = Ore
		amount = 0
		maxAmount = 600
	}
}
+PART[HeatShield2]:FINAL
{
	@name = farTestApolloShield
	@title = Apollo-size 2.5 m Heat Shield (FAR splash tests)
	@rescaleFactor = 1.564
	@mass = 0.05
	@crashTolerance = 1000
	@RESOURCE[Ablator]
	{
		@amount = 0
	}
}
